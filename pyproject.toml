[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kbel"
version = "0.1.0"
description = "A framework for knowledge base entity linking."
readme = "README.md"
requires-python = ">=3.11,<3.14"

authors = [
    { name = "Marcelo Machado", email = "marcelo.machado@ufjf.br" }
]

license = "Apache-2.0"

keywords = [
    "entity-linking",
    "knowledge-graph",
    "wikidata",
    "dbpedia",
    "nlp",
    "llm"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "kif-lib>=0.12,<0.13",
    "numpy>=2.3,<3",
    "scikit-learn>=1.7,<2",
]

[project.optional-dependencies]
similarity = [
    "sentence-transformers>=5,<6",
]

llm = [
    "langchain>=0.3,<0.4",
    "langchain-openai>=0.3,<0.4",
    "langchain-ollama>=0.3,<0.4",
]

dev = [
    "black",
    "isort",
    "pytest",
    "pytest-cov",
    "python-dotenv",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/lapic-ufjf/kbel"
Repository = "https://github.com/lapic-ufjf/kbel"
Issues = "https://github.com/lapic-ufjf/kbel/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]